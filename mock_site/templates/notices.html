{% extends "base.html" %}
{% block title %}公告列表{% endblock %}
{% block content %}
<h2>公告列表</h2>
<table id="notice-table">
  <thead>
    <tr><th>编号</th><th>标题</th><th>发布单位</th><th>发布时间</th><th>分类</th></tr>
  </thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td class="col-id">{{ r.id }}</td>
      <td class="col-title">{{ r.title }}</td>
      <td class="col-unit">{{ r.unit }}</td>
      <td class="col-date">{{ r.date }}</td>
      <td class="col-category">{{ r.category }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
